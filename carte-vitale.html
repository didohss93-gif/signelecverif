<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur Carte Vitale fictive</title>
<style>
  :root {
    --ink: #1a2b3c;
    --muted: #5a6f82;
    --line: #d9e3ec;
    --panel: #fff;
    --accent: #0b6e4f;
    --warn: #9a3412;
    --warn-bg: #fff7ed;
    --card-text: #0a140e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #f5f7fa, #e8eef3);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  header.app-head {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 12px 20px; margin-bottom: 18px;
  }
  .brand-block h1 { margin: 0 0 4px; font-size: 1.45rem; }
  .brand-block p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .badge-fictive {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--warn-bg); color: var(--warn); border: 1px solid #fdba74;
    border-radius: 10px; padding: 8px 12px; font-size: 0.8rem; font-weight: 600;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(260px, 340px) 1fr;
    gap: 18px; align-items: start;
  }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.04);
  }
  .panel h2 { margin: 0 0 12px; font-size: 0.95rem; }
  label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin: 0 0 4px; }
  .field { margin-bottom: 10px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  input[type="text"], input[type="date"], input[type="file"] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; font: inherit; font-size: 0.9rem; background: #fbfcfd;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button {
    appearance: none; border: none; cursor: pointer; font: inherit; font-weight: 700;
    font-size: 0.85rem; border-radius: 8px; padding: 9px 12px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: #eef4f8; color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px dashed var(--line); }

  .preview-stage {
    border: 1px solid var(--line); border-radius: 14px; background: #f3f6f8;
    padding: 22px 12px; display: grid; place-items: center; min-height: 300px;
  }

  /* Carte = photo de référence + champs superposés aux bonnes positions */
  .cv-card {
    position: relative;
    width: min(92vw, 560px);
    aspect-ratio: 850 / 607;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 14px 36px rgba(8, 40, 24, 0.28);
    background: #0a5a32 center / 100% 100% no-repeat;
    background-image: url("assets/carte-template.jpg");
    user-select: none;
  }

  .cv-date {
    position: absolute;
    left: 36%;
    top: 40.5%;
    width: 36%;
    color: var(--card-text);
    font-size: clamp(0.62rem, 2.05vw, 0.92rem);
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .cv-name {
    position: absolute;
    left: 36%;
    top: 49%;
    width: 34%;
    color: var(--card-text);
    line-height: 1.15;
  }
  .cv-name .prenom {
    font-size: clamp(0.78rem, 2.45vw, 1.08rem);
    font-weight: 600;
  }
  .cv-name .nom {
    font-size: clamp(0.78rem, 2.45vw, 1.08rem);
    font-weight: 700;
    text-transform: uppercase;
  }

  .cv-nir {
    position: absolute;
    left: 30%;
    top: 82%;
    width: 50%;
    color: var(--card-text);
    font-size: clamp(0.78rem, 2.5vw, 1.12rem);
    font-weight: 600;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .cv-photo {
    position: absolute;
    left: 74.2%;
    top: 21.5%;
    width: 14.6%;
    height: 43%;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.55), 0 0 18px rgba(255,255,255,.22);
    background: #1a7a45;
  }
  .cv-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .cv-photo .ph-fallback {
    width: 100%; height: 100%; display: grid; place-items: center;
    color: rgba(255,255,255,.75); font-size: 0.55rem; font-weight: 700; text-align: center;
  }

  .cv-serial {
    position: absolute;
    right: 1.6%;
    top: 50%;
    transform: translateY(-50%) rotate(180deg);
    writing-mode: vertical-rl;
    font-size: clamp(0.38rem, 1.15vw, 0.52rem);
    letter-spacing: 0.06em;
    color: #0a140e;
    white-space: nowrap;
    font-weight: 500;
  }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: #122033; color: #fff; padding: 9px 14px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; opacity: 0; pointer-events: none; transition: .2s ease; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="app-head">
      <div class="brand-block">
        <h1>Générateur Carte Vitale fictive</h1>
        <p>Rendu calé sur ta carte de référence — usage démo / soutenance uniquement.</p>
      </div>
      <div class="badge-fictive">Carte fictive · démo</div>
    </header>

    <div class="layout">
      <aside class="panel">
        <h2>Données</h2>
        <form id="form" autocomplete="off">
          <div class="row-2">
            <div class="field">
              <label for="prenom">Prénom</label>
              <input id="prenom" type="text" value="Florian" maxlength="40">
            </div>
            <div class="field">
              <label for="nom">Nom</label>
              <input id="nom" type="text" value="MOULLEC" maxlength="40">
            </div>
          </div>
          <div class="field">
            <label for="nir">N° Sécurité sociale</label>
            <input id="nir" type="text" value="1 02 02 78 621 084 16" maxlength="21" inputmode="numeric">
          </div>
          <div class="field">
            <label for="emise">Date d'émission</label>
            <input id="emise" type="date" value="2024-04-12">
          </div>
          <div class="field">
            <label for="serie">N° de série (vertical)</label>
            <input id="serie" type="text" value="80250000002 0192370411 1" maxlength="28">
          </div>
          <div class="field">
            <label for="photo">Photo</label>
            <input id="photo" type="file" accept="image/*">
          </div>
          <div class="actions">
            <button type="button" class="btn-primary" id="btnDownload">Télécharger PNG</button>
            <button type="button" class="btn-secondary" id="btnExport">Exporter JSON</button>
            <button type="button" class="btn-ghost" id="btnReset">Réinitialiser</button>
          </div>
        </form>
      </aside>

      <div class="preview-stage">
        <div class="cv-card" id="cvCard" aria-label="Carte Vitale fictive">
          <div class="cv-date">émise le <span id="outEmise">12/04/2024</span></div>
          <div class="cv-name">
            <div class="prenom" id="outPrenom">Florian</div>
            <div class="nom" id="outNom">MOULLEC</div>
          </div>
          <div class="cv-nir" id="outNir">1 02 02 78 621 084 16</div>
          <div class="cv-photo" id="photoBox">
            <img id="outPhoto" alt="Photo" src="assets/photo-defaut.jpg">
          </div>
          <div class="cv-serial" id="outSerie">80250000002 0192370411 1</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
(function () {
  var defaults = {
    prenom: 'Florian',
    nom: 'MOULLEC',
    nir: '1 02 02 78 621 084 16',
    emise: '2024-04-12',
    serie: '80250000002 0192370411 1',
    photo: 'assets/photo-defaut.jpg'
  };

  var photoData = defaults.photo;
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2000);
  }

  function formatDateFr(value) {
    if (!value) return '';
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(value)) return value;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
    return m ? (m[3] + '/' + m[2] + '/' + m[1]) : value;
  }

  function toInputDate(value) {
    if (!value) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value);
    return m ? (m[3] + '-' + m[2] + '-' + m[1]) : value;
  }

  function formatNir(raw) {
    var digits = String(raw || '').replace(/\D/g, '').slice(0, 15);
    var parts = [];
    if (digits.length > 0) parts.push(digits.slice(0, 1));
    if (digits.length > 1) parts.push(digits.slice(1, 3));
    if (digits.length > 3) parts.push(digits.slice(3, 5));
    if (digits.length > 5) parts.push(digits.slice(5, 7));
    if (digits.length > 7) parts.push(digits.slice(7, 10));
    if (digits.length > 10) parts.push(digits.slice(10, 13));
    if (digits.length > 13) parts.push(digits.slice(13, 15));
    return parts.join(' ');
  }

  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    try { return decodeURIComponent(escape(atob(s))); } catch (e) { return atob(s); }
  }

  function readForm() {
    return {
      prenom: document.getElementById('prenom').value.trim() || '—',
      nom: document.getElementById('nom').value.trim().toUpperCase() || '—',
      nir: formatNir(document.getElementById('nir').value) || defaults.nir,
      emise: formatDateFr(document.getElementById('emise').value),
      serie: document.getElementById('serie').value.trim() || defaults.serie,
      photo: photoData,
      fictive: true
    };
  }

  function render(data) {
    document.getElementById('outPrenom').textContent = data.prenom;
    document.getElementById('outNom').textContent = data.nom;
    document.getElementById('outNir').textContent = data.nir;
    document.getElementById('outEmise').textContent = data.emise;
    document.getElementById('outSerie').textContent = data.serie;
    var box = document.getElementById('photoBox');
    if (data.photo) {
      box.innerHTML = '<img id="outPhoto" alt="Photo" src="' + data.photo + '">';
    } else {
      box.innerHTML = '<div class="ph-fallback">PHOTO</div>';
    }
  }

  function applyToForm(data) {
    document.getElementById('prenom').value = data.prenom || '';
    document.getElementById('nom').value = data.nom || '';
    document.getElementById('nir').value = data.nir || '';
    document.getElementById('emise').value = toInputDate(data.emise || '');
    document.getElementById('serie').value = data.serie || '';
    photoData = data.photo || defaults.photo;
  }

  function refresh() {
    var data = readForm();
    render(data);
    return data;
  }

  function loadFromHash() {
    var raw = (location.hash || '').replace(/^#/, '');
    if (raw.indexOf('d=') === 0) raw = raw.slice(2);
    if (!raw) return false;
    try {
      var data = JSON.parse(b64urlDecode(raw));
      applyToForm({
        prenom: data.prenom || data.firstName || '',
        nom: data.nom || data.lastName || '',
        nir: data.nir || data.ssn || '',
        emise: data.emise || data.issued || '',
        serie: data.serie || data.serial || '',
        photo: data.photo || defaults.photo
      });
      refresh();
      return true;
    } catch (e) { return false; }
  }

  document.getElementById('form').addEventListener('input', function (e) {
    if (e.target.id === 'nir') {
      var start = e.target.selectionStart, before = e.target.value.length;
      e.target.value = formatNir(e.target.value);
      var after = e.target.value.length;
      try { e.target.setSelectionRange(start + (after - before), start + (after - before)); } catch (_) {}
    }
    if (e.target.id === 'nom') e.target.value = e.target.value.toUpperCase();
    refresh();
  });

  document.getElementById('photo').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) { photoData = defaults.photo; refresh(); return; }
    var reader = new FileReader();
    reader.onload = function () { photoData = reader.result; refresh(); };
    reader.readAsDataURL(file);
  });

  document.getElementById('btnExport').addEventListener('click', function () {
    var data = refresh();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'carte-vitale-fictive.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('JSON exporté');
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    applyToForm(defaults);
    document.getElementById('photo').value = '';
    history.replaceState(null, '', location.pathname + location.search);
    refresh();
    toast('Réinitialisé');
  });

  document.getElementById('btnDownload').addEventListener('click', function () {
    var card = document.getElementById('cvCard');
    function fallback() {
      // canvas export from template
      var data = refresh();
      var canvas = document.createElement('canvas');
      canvas.width = 850; canvas.height = 607;
      var ctx = canvas.getContext('2d');
      var img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 0, 0, 850, 607);
        ctx.fillStyle = '#0a140e';
        ctx.font = '500 22px Arial, Helvetica, sans-serif';
        ctx.fillText('émise le ' + data.emise, 850 * 0.36, 607 * 0.435);
        ctx.font = '600 28px Arial, Helvetica, sans-serif';
        ctx.fillText(data.prenom, 850 * 0.36, 607 * 0.525);
        ctx.font = '700 28px Arial, Helvetica, sans-serif';
        ctx.fillText(data.nom, 850 * 0.36, 607 * 0.58);
        ctx.font = '600 30px Arial, Helvetica, sans-serif';
        ctx.fillText(data.nir, 850 * 0.30, 607 * 0.86);
        function finish() {
          // serial
          ctx.save();
          ctx.translate(850 * 0.97, 607 * 0.5);
          ctx.rotate(-Math.PI / 2);
          ctx.font = '500 11px Arial, Helvetica, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(data.serie, 0, 0);
          ctx.restore();
          var a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'carte-vitale-fictive.png';
          a.click();
          toast('PNG téléchargé');
        }
        if (data.photo) {
          var p = new Image();
          p.onload = function () {
            var x = 850 * 0.742, y = 607 * 0.215, w = 850 * 0.146, h = 607 * 0.43;
            ctx.drawImage(p, x, y, w, h);
            finish();
          };
          p.onerror = finish;
          p.src = data.photo;
        } else finish();
      };
      img.src = 'assets/carte-template.jpg';
    }

    if (window.html2canvas) {
      window.html2canvas(card, { backgroundColor: null, scale: 2, useCORS: true })
        .then(function (canvas) {
          var a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'carte-vitale-fictive.png';
          a.click();
          toast('PNG téléchargé');
        })
        .catch(fallback);
    } else fallback();
  });

  (function () {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.async = true;
    document.head.appendChild(s);
  })();

  window.addEventListener('hashchange', loadFromHash);
  if (!loadFromHash()) refresh();
})();
  </script>
</body>
</html>
